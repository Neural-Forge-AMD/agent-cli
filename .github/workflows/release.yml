name: Release & Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Version tag to release (e.g. v0.1.0)"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

jobs:
  build-binaries:
    name: Build Native Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install

      - name: Compile All 6 Platform Binaries
        run: bun run build:binaries

      - name: Package Archives for GitHub Release
        run: |
          mkdir -p dist/release
          cd dist/bin
          tar -czf ../release/pikaa-linux-x64.tar.gz pikaa-linux-x64
          tar -czf ../release/pikaa-linux-arm64.tar.gz pikaa-linux-arm64
          tar -czf ../release/pikaa-darwin-x64.tar.gz pikaa-darwin-x64
          tar -czf ../release/pikaa-darwin-arm64.tar.gz pikaa-darwin-arm64
          zip -9 ../release/pikaa-windows-x64.zip pikaa-windows-x64.exe
          zip -9 ../release/pikaa-windows-arm64.zip pikaa-windows-arm64.exe
          cd ../release
          sha256sum * > SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: dist/release/*

  create-github-release:
    name: Create GitHub Release
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Built Binaries
        uses: actions/download-artifact@v4
        with:
          name: release-binaries
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    name: Publish to NPM Registry
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun Runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies & Build JS Dist
        run: |
          bun install
          bun run build:js

      - name: Publish to NPM
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
